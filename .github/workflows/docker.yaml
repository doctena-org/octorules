---
name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yaml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Push the image to GHCR after the smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: octorules:ci
      - name: Smoke test
        # The example rules intentionally contain lint findings, so ignore the
        # exit code; the assertion is the plugins line proving all five
        # providers are discovered inside the image.
        run: |
          docker run --rm octorules:ci --version
          docker run --rm -v "$PWD/examples:/octorules:ro" octorules:ci \
            lint --config config.yaml > lint.out 2>&1 || true
          cat lint.out
          grep -Eq 'Lint plugins: .*cloudflare.*aws.*google.*azure.*bunny' lint.out

  publish:
    # Runs on manual dispatch and when the release workflow calls with
    # publish: true; skipped on plain pushes and PRs. Each architecture
    # builds on its own native runner (no QEMU — emulated arm64 took the
    # provider-SDK pip install from ~75s to 7+ minutes) and pushes by
    # digest; merge stitches the multi-arch manifest.
    if: github.event_name == 'workflow_dispatch' || inputs.publish
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: digest-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.digest-build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # The image version is read from pyproject.toml, not the git ref, so
    # the dispatch and release paths tag alike.
    if: github.event_name == 'workflow_dispatch' || inputs.publish
    needs: [publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          refs=""
          for digest in *; do
            refs="$refs $IMAGE@sha256:$digest"
          done
          # shellcheck disable=SC2086  # word splitting is the point
          docker buildx imagetools create $tags $refs
      - name: Verify
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}"
