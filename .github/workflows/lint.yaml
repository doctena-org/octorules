---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release:
        description: Also require the bundled CDN data to be fresh enough to publish.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pre-commit run --all-files
      - name: CDN data fresh enough to release
        if: inputs.release
        run: .venv/bin/python scripts/sync_cdn_ranges.py --check
