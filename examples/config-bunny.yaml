# octorules — Bunny Shield configuration
#
# Manages Bunny.net Shield WAF rules (custom rules, rate-limit rules,
# access lists, edge rules) plus managed rule overrides, shield config
# (bot detection, DDoS settings), and pull zone security.
#
# Install:  pip install octorules-bunny
#
# Provider docs: https://github.com/doctena-org/octorules-bunny

providers:
  bunny:
    api_key: env/BUNNY_API_KEY   # Required (or set $BUNNY_API_KEY)
    plan: advanced               # free or advanced (for plan-aware lint)
    timeout: 30.0                # HTTP timeout (default: 30)
    max_retries: 2               # HTTP retry count (default: 2)
    max_workers: 1               # Per-provider parallelism (default: 1)
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3
  rules:
    directory: ./rules/bunny

manager:
  max_workers: 2
  plan_outputs:
    text:
      class: octorules.plan_output.PlanText

zones:
  my-pull-zone:
    sources:
      - rules
    targets:
      - bunny
