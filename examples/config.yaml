# octorules — multi-provider configuration example
#
# This config demonstrates all five providers managed from a single config,
# with representative rules under rules/ to show the orchestration shape.
# For complete, per-phase single-provider examples, see each provider package's
# own examples/ directory:
#   https://github.com/doctena-org/octorules-cloudflare/tree/main/examples
#   https://github.com/doctena-org/octorules-aws/tree/main/examples
#   https://github.com/doctena-org/octorules-azure/tree/main/examples
#   https://github.com/doctena-org/octorules-google/tree/main/examples
#   https://github.com/doctena-org/octorules-bunny/tree/main/examples

# ---------------------------------------------------------------------------
# Secret handlers — pluggable credential backends
# ---------------------------------------------------------------------------
# The built-in "env" handler (env/VAR_NAME -> $VAR_NAME) is always available.
# Declare additional handlers here; kwargs are resolved via already-registered
# handlers, so you can bootstrap with env/.
secret_handlers:
  vault:
    class: octorules_vault.VaultSecrets
    url: https://vault.internal
    token: env/VAULT_TOKEN

# ---------------------------------------------------------------------------
# Providers — one section per provider instance
# ---------------------------------------------------------------------------
providers:
  cloudflare:
    # All keys except "class" and "safety" are forwarded to the provider
    # constructor as **kwargs.  The "env/" prefix resolves the value from
    # the environment variable at runtime — keep secrets out of YAML.
    token: env/CLOUDFLARE_API_TOKEN
    timeout: 30.0
    max_retries: 2
    max_workers: 1
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3

  aws:
    region: us-west-2
    waf_scope: REGIONAL        # REGIONAL or CLOUDFRONT
    wcu_limit: 5000            # Web ACL capacity units limit for lint checks
    timeout: 30.0
    max_retries: 2
    max_workers: 1
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3
    # Authentication: standard boto3 credential chain (env vars,
    # ~/.aws/credentials, IAM roles).  No explicit key in config.

  google:
    project: env/GCLOUD_PROJECT
    timeout: 30.0
    max_workers: 1
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3
    # Authentication: Google Application Default Credentials (ADC).
    # Run "gcloud auth application-default login" locally, or use
    # Workload Identity in CI.

  azure:
    subscription_id: env/AZURE_SUBSCRIPTION_ID
    resource_group: env/AZURE_RESOURCE_GROUP
    waf_type: front_door       # front_door (default) or app_gateway
    timeout: 30.0              # For both types, run two instances — see the octorules-azure examples/
    max_workers: 1
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3

  bunny:
    api_key: env/BUNNY_API_KEY
    plan: advanced             # free or advanced (for plan-aware lint)
    timeout: 30.0
    max_retries: 2
    max_workers: 1
    safety:
      delete_threshold: 30.0
      update_threshold: 30.0
      min_existing: 3

  # Rules directory — every zone's rule file lives here as
  # `<zone-name>.yaml`. Each file is the source of truth for one zone;
  # a zone that targets several providers carries one namespace block
  # per provider in the same file (see rules/example.com.yaml).
  rules:
    directory: ./rules

# ---------------------------------------------------------------------------
# Processors — transform or filter rules in the plan/sync pipeline
# ---------------------------------------------------------------------------
processors:
  # Block all REMOVE changes as a safety guard
  no_deletes:
    class: octorules.processor.filters.ChangeTypeFilter
    exclude:
      - REMOVE

  # Only plan/sync WAF-related phases
  waf_only:
    class: octorules.processor.filters.PhaseFilter
    include:
      - waf_custom_rules
      - waf_managed_rules
      - rate_limiting_rules
      - aws_waf_custom_rules
      - aws_waf_rate_rules
      - gcloud_armor_custom_rules
      - azure_waf_custom_rules
      - bunny_waf_custom_rules

  # Skip rules whose ref starts with "test-"
  skip_test_rules:
    class: octorules.processor.filters.RefFilter
    exclude: "^test-"

  # Protect externally-managed rules (whose ref starts with "vendor-") from
  # deletion or reordering, while still cleaning up other drift. A scoped
  # alternative to the all-or-nothing allow_unmanaged flag.
  preserve_external_rules:
    class: octorules.processor.filters.PreserveFilter
    refs: "^vendor-"
    change_types:
      - REMOVE
      - REORDER

# ---------------------------------------------------------------------------
# Manager — concurrency and plan output settings
# ---------------------------------------------------------------------------
manager:
  max_workers: 4               # Parallel zone/phase processing (default: 1)
  strict_sections: false       # true: error (instead of warn) when a zone-file
                               # section would be skipped unmanaged; each zone
                               # can override with its own strict_sections key
  plan_outputs:
    text:
      class: octorules.plan_output.PlanText
    json:
      class: octorules.plan_output.PlanJson
      path: /tmp/octorules-plan.json
    markdown:
      class: octorules.plan_output.PlanMarkdown
      path: /tmp/octorules-plan.md
    html:
      class: octorules.plan_output.PlanHtml
      path: /tmp/octorules-plan.html

# ---------------------------------------------------------------------------
# Cloudflare Account-Level Rules
# ---------------------------------------------------------------------------
# Cloudflare has 6 account-level-only phases that cannot be deployed at the
# zone level (bulk_redirect_rules, network_ddos_rules, network_firewall_rules,
# network_firewall_managed, network_firewall_ratelimit, network_firewall_ids).
#
# Account rules files are loaded from the configured rules directory by
# slugified account name — here, rules/<account-slug>.yaml (e.g. an
# account named "Example Account" -> rules/example-account.yaml).
# See that file: bulk_redirect_rules is exemplified; the five Magic Transit
# (L4) phases are documented but not exemplified (no offline L4 expression
# schema).

# ---------------------------------------------------------------------------
# Zones — per-zone settings
# ---------------------------------------------------------------------------
# The key under "zones:" is the zone name.  The rules file for each zone
# must match: rules/<zone-name>.yaml.  What "zone name" means depends on
# the provider:
#
#   Cloudflare       — DNS domain (e.g. example.com)
#   AWS WAF          — Web ACL name (e.g. example-com-alb)
#   Google Cloud Armor — security policy name (e.g. example-org-policy)
#   Azure WAF        — WAF policy name (e.g. apiexamplewaf)
#   Bunny Shield     — pull zone name (e.g. static-example-com)
#
# At runtime, resolve_zone_id("<name>") translates the name to the
# provider's internal ID.
zones:
  # The main site — a true multi-provider zone: Cloudflare fronts the
  # domain at the edge, AWS WAF guards the origin ALB behind it. One
  # rules file (rules/example.com.yaml) carries both namespace blocks;
  # each target plans and applies only its own. zone_names maps the
  # zone to the differently-named Web ACL on the AWS side.
  example.com:
    sources:
      - rules
    targets:
      - cloudflare
      - aws
    zone_names:
      aws: example-com-alb
    processors:
      - no_deletes
    safety:
      delete_threshold: 10.0   # Stricter threshold for this zone
      update_threshold: 30.0
      min_existing: 5

  # A second domain on Google Cloud — the zone name is the Cloud Armor
  # security policy guarding the example.org load balancer.
  example-org-policy:
    sources:
      - rules
    targets:
      - google
    always_dry_run: true       # Never apply changes (review-only)

  # api.example.com behind Azure Front Door — the zone name is the WAF
  # policy name (Front Door policy names allow only alphanumerics and
  # must start with a letter).
  apiexamplewaf:
    sources:
      - rules
    targets:
      - azure

  # static.example.com served by a Bunny pull zone — the zone name is
  # the pull zone name.
  static-example-com:
    sources:
      - rules
    targets:
      - bunny

  # Multi-target — the same rules deployed to two Cloudflare accounts.
  # Each target produces its own plan.  Requires explicit "class:" since
  # auto-discovery can't distinguish two instances of the same provider.
  # example.net:
  #   sources:
  #     - rules
  #   targets:
  #     - cf-account-a
  #     - cf-account-b

  # Wildcard zone template — auto-discover zones from a specific
  # provider. The parser requires explicit `targets:` whenever the
  # config declares more than one provider, so the wildcard expansion
  # knows which provider to query for the discovered-zone list.
  # Creates a zone for every provider-discovered zone with a matching
  # rules/<zone>.yaml file.
  '*':
    sources:
      - rules
    targets:
      - cloudflare      # zones list pulled from Cloudflare's API
    allow_unmanaged: false

# ---------------------------------------------------------------------------
# YAML includes — split large configs with !include directives
# ---------------------------------------------------------------------------
# Includes resolve relative to the file containing the directive.
# Nested includes and circular include detection are supported.
#
#   zones:
#     example.com: !include zones/example.yaml
#
# In rule files:
#
#   redirect_rules: !include shared/redirects.yaml
