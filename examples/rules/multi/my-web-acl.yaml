# AWS WAF v2 rules for Web ACL "my-web-acl"
#
# AWS WAF uses JSON-style statement structures.  Rules are normalized to use
# "ref" (mapped from the AWS "Name" field) as the stable identifier.
#
# Nested under "aws:" block with phase names stripped of aws_ prefix:
#   waf_custom_rules (from aws_waf_custom_rules)
#   waf_rate_rules (from aws_waf_rate_rules)
#   waf_managed_rules (from aws_waf_managed_rules)
#   waf_rule_group_rules (from aws_waf_rule_group_rules)
#
# Statement reference:
# https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statements.html

aws:
  # ---------------------------------------------------------------------------
  # Custom Rules — standard match-and-action rules
  # ---------------------------------------------------------------------------
  waf_custom_rules:
    - ref: block-bad-ips
      Priority: 1
      Action:
        Block: {}
      Statement:
        IPSetReferenceStatement:
          # ARN's logical name (`blocked-ips`) matches the IP set defined in
          # the `lists:` section, so octorules manages the IP set's full
          # lifecycle. Referencing an externally-managed IP set by a name
          # not in `lists:` triggers WA326 (lifecycle hint).
          ARN: arn:aws:wafv2:us-west-2:123456789012:regional/ipset/blocked-ips/abcd1234
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: block-bad-ips

    - ref: allow-internal
      Priority: 2
      Action:
        Allow: {}
      Statement:
        IPSetReferenceStatement:
          ARN: arn:aws:wafv2:us-west-2:123456789012:regional/ipset/internal-ips/efgh5678
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: allow-internal

    - ref: block-bad-user-agents
      Priority: 3
      Action:
        Block:
          CustomResponse:
            ResponseCode: 403
            ResponseHeaders:
              - Name: x-blocked-by
                Value: octorules
      Statement:
        ByteMatchStatement:
          FieldToMatch:
            SingleHeader:
              Name: user-agent
          PositionalConstraint: CONTAINS
          SearchString: sqlmap
          TextTransformations:
            - Priority: 0
              Type: LOWERCASE
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: block-bad-user-agents

    - ref: geo-block
      Priority: 4
      Action:
        Block: {}
      Statement:
        GeoMatchStatement:
          CountryCodes:
            - KP
            - IR
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: geo-block

    - ref: size-limit
      Priority: 5
      Action:
        Block: {}
      Statement:
        SizeConstraintStatement:
          FieldToMatch:
            Body:
              OversizeHandling: MATCH
          ComparisonOperator: GT
          Size: 8192
          TextTransformations:
            - Priority: 0
              Type: NONE
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: size-limit

  # ---------------------------------------------------------------------------
  # Rate-Based Rules — rate limiting with aggregation
  # ---------------------------------------------------------------------------
  waf_rate_rules:
    - ref: rate-limit-api
      Priority: 10
      Action:
        Block:
          CustomResponse:
            ResponseCode: 429
      Statement:
        RateBasedStatement:
          Limit: 2000
          AggregateKeyType: IP
          ScopeDownStatement:
            ByteMatchStatement:
              FieldToMatch:
                UriPath: {}
              PositionalConstraint: STARTS_WITH
              SearchString: /api/
              TextTransformations:
                - Priority: 0
                  Type: NONE
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: rate-limit-api

  # ---------------------------------------------------------------------------
  # Managed Rule Groups — AWS and marketplace rules
  # ---------------------------------------------------------------------------
  waf_managed_rules:
    - ref: aws-common-rules
      Priority: 100
      Statement:
        ManagedRuleGroupStatement:
          VendorName: AWS
          Name: AWSManagedRulesCommonRuleSet
          # Pin a specific managed-rule version — unpinned groups (no
          # `Version`) auto-update and can change behaviour without notice.
          Version: Version_2.0
          # `RuleActionOverrides` is the current AWS API; the older
          # `ExcludedRules` field was deprecated in late 2023. Use
          # `ActionToUse: {Count: {}}` to log-only a managed sub-rule
          # instead of excluding it entirely.
          RuleActionOverrides:
            - Name: SizeRestrictions_BODY
              ActionToUse:
                Count: {}
      OverrideAction:
        None: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: aws-common-rules

    - ref: aws-sqli-rules
      Priority: 101
      Statement:
        ManagedRuleGroupStatement:
          VendorName: AWS
          Name: AWSManagedRulesSQLiRuleSet
          Version: Version_3.0
      OverrideAction:
        None: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: aws-sqli-rules

    - ref: aws-bad-inputs
      Priority: 102
      Statement:
        ManagedRuleGroupStatement:
          VendorName: AWS
          Name: AWSManagedRulesKnownBadInputsRuleSet
          Version: Version_1.18
      # Block (not Count) by default — `Count` without a `ScopeDownStatement`
      # logs every request that matches the managed group, which inflates
      # CloudWatch volume and rarely matches operator intent.
      OverrideAction:
        None: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: aws-bad-inputs

  # ---------------------------------------------------------------------------
  # Rule Group References — custom rule groups attached to the Web ACL
  # ---------------------------------------------------------------------------
  waf_rule_group_rules:
    - ref: api-protection-group
      Priority: 200
      Statement:
        RuleGroupReferenceStatement:
          ARN: arn:aws:wafv2:us-west-2:123456789012:regional/rulegroup/api-protection/abcd1234
          ExcludedRules:
            - Name: RateLimit5xx
      OverrideAction:
        None: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: api-protection-group

    - ref: shared-ip-blocklist-group
      Priority: 201
      Statement:
        RuleGroupReferenceStatement:
          ARN: arn:aws:wafv2:us-west-2:123456789012:regional/rulegroup/ip-blocklist/efgh5678
      OverrideAction:
        Count: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: shared-ip-blocklist-group

  # ---------------------------------------------------------------------------
  # Custom Rulesets (Rule Groups) — create and manage rule groups inline
  # ---------------------------------------------------------------------------
  # Rule groups are AWS WAF's way of bundling rules for reuse across Web ACLs.
  # "capacity" is immutable after creation — plan carefully.
  # Replace account IDs and resource IDs with your own.
  custom_rulesets:
    - name: bot-protection
      capacity: 100
      description: "Bot detection and blocking rules"
      phase: aws_waf_custom
      rules:
        - ref: block-scanner-uas
          Priority: 1
          Action:
            Block: {}
          Statement:
            ByteMatchStatement:
              FieldToMatch:
                SingleHeader:
                  Name: user-agent
              PositionalConstraint: CONTAINS
              SearchString: sqlmap
              TextTransformations:
                - Priority: 0
                  Type: LOWERCASE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: block-scanner-uas

  # ---------------------------------------------------------------------------
  # Lists — IP Sets and Regex Pattern Sets
  # ---------------------------------------------------------------------------
  # Lists are standalone AWS WAF resources referenced by rules via ARN.
  # octorules manages their contents; the provider creates/deletes the
  # resources as needed.
  lists:
    - name: blocked-ips
      kind: ip
      description: "Known bad IPs"
      items:
        - ip: "198.51.100.0/24"
        - ip: "203.0.113.0/24"
        - ip: "192.0.2.0/24"

    - name: internal-ips
      kind: ip
      description: "Internal monitoring and health-check IPs"
      items:
        - ip: "10.0.0.0/8"
        - ip: "172.16.0.0/12"

    - name: bad-ua-patterns
      kind: regex
      description: "Bad user-agent regex patterns"
      items:
        - regex: "(?i)sqlmap"
        - regex: "(?i)nikto"
        - regex: "(?i)nessus"
