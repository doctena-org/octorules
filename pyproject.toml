[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octorules"
version = "0.26.1"
description = "WAF rules as code — manage rules across providers declaratively"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Martin Simon" },
    { name = "Doctena S.A." },
]
keywords = ["waf", "rules", "iac", "infrastructure-as-code", "octodns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml~=6.0",
    "shtab>=1.7.0",
]

[project.optional-dependencies]
# Install octorules[wirefilter] for full expression lint coverage.
# Without it, expression validation uses a regex fallback that can only
# extract field/function names, missing syntax errors, type mismatches,
# and invalid operators that wirefilter catches.
cloudflare = [
    "octorules-cloudflare>=0.1",
]
wirefilter = [
    "octorules-wirefilter>=0.3.2,<1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "yamllint>=1.35.0",
    "build",
]

[project.urls]
Homepage = "https://github.com/doctena-org/octorules"
Repository = "https://github.com/doctena-org/octorules"
Issues = "https://github.com/doctena-org/octorules/issues"

[project.scripts]
octorules = "octorules.cli:main"

[tool.setuptools.package-data]
"octorules.data" = ["cdn_ranges/*.json"]

[tool.setuptools.packages.find]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use intentional unicode chars (minus sign, en-dash) to verify formatter output,
# and regex metacharacters in pytest.raises(match=...) are intentional patterns.
"tests/*" = ["RUF001", "RUF002", "RUF003", "RUF012", "RUF043"]

[tool.pytest.ini_options]
testpaths = ["tests"]
